# 可选的快速验证:1 副本 Keeper 加 1 分片 2 副本 ClickHouse,小规格,数据放在容器本地盘。
# 只用来确认镜像、调度和 operator 工作正常,验证完就删除,不要用于存放数据。
apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: quick-keeper
  namespace: clickhouse
spec:
  defaults:
    templates:
      podTemplate: arm
  configuration:
    clusters:
      - name: keeper
        layout:
          replicasCount: 1
  templates:
    podTemplates:
      - name: arm
        spec:
          nodeSelector:
            kubernetes.io/arch: arm64
            workload: clickhouse
          tolerations:
            - key: dedicated
              operator: Equal
              value: clickhouse
              effect: NoSchedule
          containers:
            - name: clickhouse-keeper
              image: clickhouse/clickhouse-keeper:26.10
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: quick
  namespace: clickhouse
spec:
  defaults:
    templates:
      podTemplate: arm
  configuration:
    zookeeper:
      nodes:
        - host: keeper-quick-keeper
          port: 2181
    clusters:
      - name: test
        layout:
          shardsCount: 1
          replicasCount: 2
  templates:
    podTemplates:
      - name: arm
        spec:
          nodeSelector:
            kubernetes.io/arch: arm64
            workload: clickhouse
          tolerations:
            - key: dedicated
              operator: Equal
              value: clickhouse
              effect: NoSchedule
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:26.10
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  memory: 4Gi
