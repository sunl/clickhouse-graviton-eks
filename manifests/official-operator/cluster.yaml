# 用 ClickHouse 官方 operator 部署的示例:1 副本 Keeper 加 1 分片 2 副本 ClickHouse,数据在 gp3 卷上。
# 官方 operator 的 API 还是 v1alpha1,仅建议用于 PoC。
# 这里没有设置 spec.settings.defaultUserPassword,default 用户无密码,apply 时会有警告。
apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: official-keeper
  namespace: clickhouse-official
spec:
  replicas: 1
  podTemplate:
    nodeSelector:
      kubernetes.io/arch: arm64
      workload: clickhouse
    tolerations:
      - key: dedicated
        operator: Equal
        value: clickhouse
        effect: NoSchedule
  containerTemplate:
    image:
      repository: clickhouse/clickhouse-keeper
      tag: "26.10"
  dataVolumeClaimSpec:
    storageClassName: gp3
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 5Gi
---
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: official
  namespace: clickhouse-official
spec:
  replicas: 2
  shards: 1
  keeperClusterRef:
    name: official-keeper
  podTemplate:
    nodeSelector:
      kubernetes.io/arch: arm64
      workload: clickhouse
    tolerations:
      - key: dedicated
        operator: Equal
        value: clickhouse
        effect: NoSchedule
  containerTemplate:
    image:
      repository: clickhouse/clickhouse-server
      tag: "26.10"
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        memory: 4Gi
  dataVolumeClaimSpec:
    storageClassName: gp3
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 10Gi
