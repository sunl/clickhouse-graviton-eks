# 不用 operator 的部署方式:ClickHouse Keeper,3 副本,普通的 StatefulSet 加 ConfigMap。
# 先部署这个文件,等 3 个 pod 就绪后再部署 clickhouse.yaml。
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-keeper-config
  namespace: clickhouse
data:
  keeper_config.xml: |
    <clickhouse>
      <logger>
        <level>information</level>
        <console>true</console>
      </logger>
      <listen_host>0.0.0.0</listen_host>
      <keeper_server>
        <tcp_port>2181</tcp_port>
        <!-- 每个 pod 的编号不同,由启动命令根据 pod 序号算出来 -->
        <server_id from_env="KEEPER_SERVER_ID"/>
        <log_storage_path>/var/lib/clickhouse-keeper/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse-keeper/coordination/snapshots</snapshot_storage_path>
        <coordination_settings>
          <operation_timeout_ms>10000</operation_timeout_ms>
          <session_timeout_ms>30000</session_timeout_ms>
          <raft_logs_level>information</raft_logs_level>
        </coordination_settings>
        <raft_configuration>
          <server>
            <id>1</id>
            <hostname>clickhouse-keeper-0.clickhouse-keeper-headless.clickhouse.svc.cluster.local</hostname>
            <port>9234</port>
          </server>
          <server>
            <id>2</id>
            <hostname>clickhouse-keeper-1.clickhouse-keeper-headless.clickhouse.svc.cluster.local</hostname>
            <port>9234</port>
          </server>
          <server>
            <id>3</id>
            <hostname>clickhouse-keeper-2.clickhouse-keeper-headless.clickhouse.svc.cluster.local</hostname>
            <port>9234</port>
          </server>
        </raft_configuration>
      </keeper_server>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-keeper-headless
  namespace: clickhouse
spec:
  clusterIP: None
  publishNotReadyAddresses: true    # Keeper 之间要在就绪之前就能互相解析到
  selector:
    app: clickhouse-keeper
  ports:
    - name: client
      port: 2181
    - name: raft
      port: 9234
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse-keeper
  namespace: clickhouse
spec:
  serviceName: clickhouse-keeper-headless
  replicas: 3                       # 需要奇数个副本才能容忍单点故障
  podManagementPolicy: Parallel     # 三个副本同时启动,否则第一个等不到多数派
  selector:
    matchLabels:
      app: clickhouse-keeper
  template:
    metadata:
      labels:
        app: clickhouse-keeper
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
        workload: clickhouse        # 专用节点组的标签
      tolerations:
        - key: dedicated
          operator: Equal
          value: clickhouse
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: clickhouse-keeper
      securityContext:
        runAsUser: 101              # 镜像里的 clickhouse 用户
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: clickhouse-keeper
          image: clickhouse/clickhouse-keeper:26.10
          command:
            - bash
            - -c
            - |
              export KEEPER_SERVER_ID=$(( ${HOSTNAME##*-} + 1 ))
              exec clickhouse-keeper --config-file=/etc/clickhouse-keeper/keeper_config.xml
          ports:
            - name: client
              containerPort: 2181
            - name: raft
              containerPort: 9234
          readinessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse-keeper
            - name: config
              mountPath: /etc/clickhouse-keeper
      volumes:
        - name: config
          configMap:
            name: clickhouse-keeper-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: gp3
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
