# 已验证:在 eks-test(us-east-1,K8s 1.32)的 c8g.8xlarge 节点上实际部署通过。
# 数据放在容器本地盘,pod 重建即丢失,仅用于安装和功能验证。
# 第 1 步:先部署 Keeper,等 STATUS = Completed 再部署 ClickHouse。
apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: graviton-keeper
  namespace: clickhouse-test
spec:
  defaults:
    templates:
      podTemplate: arm
  configuration:
    clusters:
      - name: keeper
        layout:
          replicasCount: 1
  templates:
    podTemplates:
      - name: arm
        spec:
          nodeSelector:
            kubernetes.io/arch: arm64
            workload: clickhouse-test
          containers:
            - name: clickhouse-keeper
              image: clickhouse/clickhouse-keeper:25.8
              resources:
                requests:
                  cpu: "1"
                  memory: 1Gi
